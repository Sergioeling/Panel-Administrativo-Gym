<div class="modal-header">
    <h4 class="modal-title fw-bold text-white d-flex align-items-center">
        <i class="fas fa-utensils me-2"></i>
        {{ modalTitle }}
    </h4>
    <button type="button" class="btn-close btn-close-white" (click)="onCancel()"></button>
</div>

<div class="modal-body p-3 p-md-4" style="max-height: 80vh; overflow-y: auto;">
    <!-- Error Alert -->
    <div *ngIf="errorMsg" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        {{ errorMsg }}
        <button type="button" class="btn-close" (click)="clearError()"></button>
    </div>

    <!-- Edit Mode Info Alert -->
    <div *ngIf="isEdit && tipoComidaData" class="alert alert-info alert-dismissible fade show mb-4" role="alert">
        <i class="fas fa-info-circle me-2"></i>
        <strong>Modo Edición:</strong> Modificando tipo de comida "{{ tipoComidaData.nombre }}"
    </div>

    <form [formGroup]="comidaForm" (ngSubmit)="onSubmit()">
        <!-- Nombre -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-warning text-white">
                <h5 class="mb-0 d-flex align-items-center">
                    <i class="fas fa-font me-2"></i>
                    Nombre de la Comida
                </h5>
            </div>
            <div class="card-body p-3 p-md-4">
                <input type="text" class="form-control" formControlName="nombre"
                    [class.is-invalid]="isFieldInvalid('nombre')" placeholder="Ej: Desayuno, Almuerzo, Cena" />
                <div *ngIf="isFieldInvalid('nombre')" class="invalid-feedback">
                    {{ getFieldError('nombre') }}
                </div>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer bg-light p-3">
    <div class="d-flex flex-column flex-md-row gap-2 w-100 w-md-auto">
        <button type="button" class="btn btn-secondary order-2 order-md-1" (click)="onCancel()" [disabled]="loading">
            <i class="fas fa-times me-2"></i>
            Cancelar
        </button>
        <button type="button" class="btn btn-{{ isEdit ? 'primary' : 'success' }} order-1 order-md-2"
            (click)="onSubmit()" [disabled]="loading || comidaForm.invalid">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            <i *ngIf="!loading" class="fas fa-{{ isEdit ? 'save' : 'plus-circle' }} me-2"></i>
            {{ submitButtonText }}
        </button>
    </div>
</div>
