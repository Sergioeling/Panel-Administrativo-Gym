<div class="modal-header modal-header-custom">
  <h5 class="modal-title">
    Documentos del Nutricionista
  </h5>

  <button class="btn-close btn-close-white" (click)="cerrar()"></button>
</div>

<div class="modal-body modal-body-custom">

  <!-- Info usuario -->
  <div class="user-card">
    <div class="user-info">
      <div>
        <span class="label">Nombre</span>
        <p>{{ usuario.nombre }}</p>
      </div>

      <div>
        <span class="label">Correo</span>
        <p>{{ usuario.email }}</p>
      </div>
    </div>
  </div>

  <!-- Loader -->
  <div class="loading" *ngIf="loading">
    Cargando documentos...
  </div>

  <!-- Tabla documentos -->
  <div class="table-container" *ngIf="!loading">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Documento</th>
          <th>Archivo</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let doc of documentos">
          <td class="doc-name">
            {{ doc.tipo_documento | titlecase }}
          </td>

          <td>
            <a
              class="file-link"
              [href]="doc.archivo_path"
              target="_blank"
            >
              Ver archivo
            </a>
          </td>

          <td class="actions">
            <button class="btn btn-success btn-sm">
              Aceptar
            </button>

            <button class="btn btn-danger btn-sm">
              Rechazar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<div class="modal-footer modal-footer-custom">
  <button class="btn btn-secondary" (click)="cerrar()">
    Cerrar
  </button>
</div>
