<div class="modal-header modal-header-custom">
  <h5 class="modal-title">
    Documentos del Nutricionista
  </h5>

  <button class="btn-close btn-close-white" (click)="cerrar()"></button>
</div>

<div class="modal-body modal-body-custom">

  <!-- Info usuario -->
  <div class="user-card">
    <div class="user-info">
      <div>
        <span class="label">Nombre</span>
        <p>{{ usuario.nombre }}</p>
      </div>

      <div>
        <span class="label">Correo</span>
        <p>{{ usuario.email }}</p>
      </div>
    </div>
  </div>

  <!-- Loader -->
  <div class="loading" *ngIf="loading">
    Cargando documentos...
  </div>

  <!-- Tabla documentos -->
  <div class="table-container" *ngIf="!loading">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Documento</th>
          <th>Archivo</th>
          <th>Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let doc of documentos">
          <!-- Documento -->
          <td class="doc-name">
            {{ doc.tipo_documento | titlecase }}
          </td>

          <!-- Archivo -->
          <td>
            <a
              class="file-link"
              [href]="doc.archivo_path"
              target="_blank"
            >
              Ver archivo
            </a>
          </td>

          <!-- Estado -->
        <td>
            <span
                class="estado pendiente"
                *ngIf="doc.estado == 2"
            >
                Pendiente
            </span>

            <span
                class="estado aprobado"
                *ngIf="doc.estado == 1"
            >
                Aceptado
            </span>

            <span
                class="estado rechazado"
                *ngIf="doc.estado == 0"
            >
                Rechazado
            </span>
        </td>


          <!-- Acciones -->
          <td class="actions">
            <ng-container *ngIf="doc.estado == 2">
              <button
                class="btn btn-success btn-sm"
                (click)="aceptarDocumento(doc)"
              >
                Aceptar
              </button>

              <button
                class="btn btn-danger btn-sm"
                (click)="rechazarDocumento(doc)"
              >
                Rechazar
              </button>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<div class="modal-footer modal-footer-custom">
  <button class="btn btn-secondary" (click)="cerrar()">
    Cerrar
  </button>
</div>
